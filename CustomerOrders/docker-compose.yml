services:
  postgres:
    image: postgres:15-alpine
    container_name: orders-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      #- ./src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordersdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orders-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-orders-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ordersdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JAVA_OPTS: -Xmx512m -Xms256m
    depends_on:
      # Ensures the database container starts before the application container
      postgres:
        condition: service_healthy
    networks:
      - orders-network

networks:
  orders-network:
    driver: bridge # no need to specify as well since bridge is default.

volumes:
  postgres-data:
    driver: local